name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # check_release.py compares with the last release tag
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Gate checks against their fixtures
        run: python scripts/test_checks.py
      - name: sdlc-audit probe cases
        run: python plugins/sdlc/skills/sdlc-audit/test_probe.py
      - name: Gate runner tests
        run: python plugins/gate/tests/test_run.py
      - name: Security module tests
        run: python plugins/security/tests/test_security.py
      - name: Repo clinic lint cases
        run: python plugins/fit/skills/repo-clinic/test_lint.py
      - name: Tool audit tests
        run: python plugins/ai-ops/skills/tool-audit/test_tool_audit.py
      - name: Changelog draft tests
        run: python plugins/sdlc/tests/test_changelog_draft.py
      - name: Release check tests
        run: python scripts/test_release.py
      - name: Repository consistency
        run: python scripts/check_repo.py
      - name: Release metadata and plugin versions
        run: python scripts/check_release.py

  validate:
    name: Plugin manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Claude Code (version and tarball hashes pinned in ci/claude-code/package-lock.json)
        run: |
          cp ci/claude-code/package.json ci/claude-code/package-lock.json "$RUNNER_TEMP/"
          npm ci --prefix "$RUNNER_TEMP" --no-audit --no-fund
          echo "$RUNNER_TEMP/node_modules/.bin" >> "$GITHUB_PATH"
      - name: claude plugin validate --strict
        run: |
          claude --version
          claude plugin validate --strict .
          for p in plugins/* plugins/*/skills; do claude plugin validate --strict "$p"; done

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor (version and wheel hashes pinned in ci/zizmor/requirements.txt)
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --require-hashes --no-deps --only-binary :all: -r ci/zizmor/requirements.txt
      - name: zizmor .github
        # Online audits (impostor commits, known-vulnerable actions, stale version comments) read the
        # GitHub API with the job token. Accepted findings, each with a reason, are in .github/zizmor.yml.
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/zizmor/bin/zizmor" --format github .github'

  shellcheck:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck every tracked shell script
        # shellcheck comes with the ubuntu-24.04 runner image. review-pr.sh runs on macOS bash 3.2, so a
        # warning there can be a broken run on the owner's machine.
        run: |
          shellcheck --version | head -n 2
          git ls-files -z '*.sh' | xargs -0 shellcheck -S warning

name: change-review

# Reviews each pull request with this repository's own /sdlc:change-review skill and posts the review
# as one comment, which later runs on the same pull request update in place.
#
# - The skill is installed from the base branch, so a pull request cannot change the reviewer that
#   reviews it. The code under review is the pull request's merge result.
# - Two jobs. "review" runs Claude Code with read-only tools and a read-only token and returns the
#   review as structured output; it cannot post, push or edit. "comment" posts that output and has
#   no checkout, no secret and no model.
# - Pull requests from forks and from bots are skipped: they get no secrets, and the action stops
#   for actors without write access.
# - The token is the repository secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`). Without
#   it the review job skips its steps and passes, and no comment is posted.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: change-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Change review
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read        # check out the merge result and the base branch
      pull-requests: read   # gh pr view and gh pr diff
    outputs:
      result: ${{ steps.claude.outputs.structured_output }}
    steps:
      - name: Check for the token
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set, so the change review is skipped."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Reviewer skill from the base branch
        if: steps.token.outputs.present == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git worktree add --detach "$RUNNER_TEMP/reviewer" "$BASE_SHA"

      - name: Review with /sdlc:change-review
        id: claude
        if: steps.token.outputs.present == 'true'
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          plugin_marketplaces: ${{ runner.temp }}/reviewer
          plugins: sdlc@cto-powersuit
          prompt: |
            /sdlc:change-review

            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}. The merge result of the pull request is checked out in the working directory. `gh pr view` and `gh pr diff` read the pull request; `git diff origin/main...HEAD` gives the same diff.

            This run is headless in CI and nobody can answer questions:
            - Read only. Do not run /sdlc:pre-push, tests, builds or installs.
            - Do not post to GitHub. Return the review in the `review` field; the workflow posts it as one comment.
            - Write the review in Markdown: the findings ordered block, should, note, each with file, line and the fix, then one line with the counts. With no findings, say so in one line.
            - The repository is public. Mask any secret you find.
          claude_args: >-
            --max-turns 40
            --allowedTools "Skill,Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*)"
            --disallowedTools "Edit,Write,NotebookEdit,WebFetch,WebSearch"
            --json-schema '{"type":"object","properties":{"review":{"type":"string","description":"The review in Markdown"}},"required":["review"],"additionalProperties":false}'

  comment:
    name: Post the review
    needs: review
    if: needs.review.outputs.result != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write  # post or update the review comment
    steps:
      - name: Post or update the review comment
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.review.outputs.result }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker="<!-- cto-powersuit:change-review -->"
          {
            echo "$marker"
            echo "## Change review (/sdlc:change-review)"
            echo
            jq -r '.review' <<< "$RESULT"
            echo
            echo "<sub>Commit ${HEAD_SHA:0:7}, [run]($RUN_URL). Written by Claude Code with this repository's sdlc plugin from the base branch. A person approves; this review never does.</sub>"
          } > body.md
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md > /dev/null
            echo "updated comment $id"
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F body=@body.md > /dev/null
            echo "posted a new comment"
          fi

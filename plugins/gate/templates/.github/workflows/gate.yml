name: Gate

# The gate runs on every push to main, on a weekly schedule and by hand.
# The deploy job waits for two jobs. The gate job runs the rules in gate/gate.json.
# The tests job runs the repository's own test command, named under "tests" in
# gate/gate.json (no language is guessed). A failing rule in the block tier, or a
# failing test run once "tests.tier" is block, stops the deploy and the previous
# build stays live. Tests ship on the warn tier: a failing test run is reported
# and the deploy still runs, until the repository records a false-positive test
# and moves the tier to block (/gate:add-rule, path C). Pull request CI
# (/sdlc:test-strategy, step 4) stops the merge; this job stops the deploy and
# leaves a failing commit on main until a fix or a revert lands.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Run the checks
        uses: ./.github/actions/gate
        with:
          config: gate/gate.json

      - name: Commit latest.json, summary.md and reporter output
        # Keeps the run history in git. gate/.gitignore keeps runs/ and .result out; pages that
        # reporters write into gate/ are committed too. Delete this step to keep the history in the run artifacts only.
        run: |
          git config user.name "gate-bot"
          git config user.email "gate-bot@users.noreply.github.com"
          git add gate/
          if git diff --cached --quiet; then
            echo "no change to commit"
          else
            git commit -m "gate: run $(date -u +%Y-%m-%dT%H:%M:%SZ) (${{ github.event_name }}) [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Gate
        run: |
          result=$(cat gate/.result)
          echo "overall: $result"
          if [ "$result" != "pass" ]; then
            echo "::error::gate checks failed; deploy blocked, the previous build stays live"
            exit 1
          fi

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30  # a run that times out fails the job, and the deploy waits on any tier
    permissions:
      contents: read  # the test command is project code: it gets no write token
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up the toolchain
        # Fill in what the test command needs: language runtime, dependencies, services.
        # Pin each action by commit SHA (the gate.actions-pinned rule checks it).
        run: echo "Replace this step with the setup your test command needs."

      - name: Run the tests
        # Reads tests.command and tests.tier from gate/gate.json. With no command it says so in the
        # run summary and, on the block tier, fails.
        run: python3 .github/actions/gate/run_tests.py --config gate/gate.json

  deploy:
    name: Deploy
    needs: [gate, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (after the bot commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref_name }}

      - name: Deploy
        run: echo "Replace this step with your deploy steps."
